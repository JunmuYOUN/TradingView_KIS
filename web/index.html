<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIS Tradingview</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 13 6 7l3 3 6-7%22 stroke=%22%232962ff%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="top">
    <div id="search">
      <input id="symbol" placeholder="종목명·코드 검색 (초성 가능)" autocomplete="off" spellcheck="false" maxlength="40"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
      <div id="suggest" role="listbox" hidden></div>
    </div>
    <div id="tfs" class="group"></div>
    <span id="source" class="badge">…</span>
    <span id="live" class="badge live" data-kind="off"><i></i><span id="live-text">연결 중</span></span>
    <span id="status" class="status"></span>
  </header>

  <div id="body">
    <nav id="side">
      <div id="tools" class="vgroup"></div>
      <hr>
      <label class="check" title="점을 찍을 때 가장 가까운 시가·고가·저가·종가에 붙입니다"><input id="magnet" type="checkbox"> 자석</label>
      <button id="undo" title="되돌리기 (Ctrl+Z)">되돌리기</button>
      <button id="clear" title="이 종목의 선을 모두 지웁니다">모두 지우기</button>
      <hr>
      <div id="style" hidden>
        <div class="label">선택한 선</div>
        <label class="row">색 <input id="color" type="color"></label>
        <label class="row">굵기
          <select id="width"><option>1</option><option>1.5</option><option>2</option><option>3</option><option>4</option></select>
        </label>
        <label class="check" id="extend-wrap"><input id="extend" type="checkbox"> 오른쪽 연장</label>
        <button id="del" class="danger" title="Delete 키">삭제</button>
      </div>
      <div class="foot"><span id="saved"></span></div>
    </nav>

    <main>
      <div id="legend"></div>
      <div id="chart"></div>
    </main>
  </div>

  <script src="/vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
